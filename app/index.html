<style>

@keyframes chin{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.chhead{display:flex;align-items:center;gap:12px;padding:14px 14px 12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,rgba(255,79,154,.16),transparent)}
.chhead b{display:block;font:800 .95rem/1.2 var(--fh);font-stretch:118%}
.chhead small{color:var(--mu);font-size:.72rem}
.chav{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));font-size:1.15rem;box-shadow:0 8px 20px -8px var(--glow)}
.chx{margin-left:auto;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);cursor:pointer;font-size:.9rem}
.chlog{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chm{max-width:88%;padding:11px 14px;border-radius:18px;font-size:.9rem;line-height:1.5;word-wrap:break-word}
.chm.b{align-self:flex-start;background:rgba(255,255,255,.065);border:1px solid var(--line);border-bottom-left-radius:6px}
.chm.u{align-self:flex-end;background:linear-gradient(135deg,var(--ac),#ff7ab6);color:#1a0712;font-weight:600;border-bottom-right-radius:6px}
.chm b{color:#fff}.chm.u b{color:#1a0712}
.chm .chact{margin-top:10px;display:inline-flex}
.chchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chchip{border:1px solid rgba(255,179,217,.35);background:rgba(255,79,154,.08);color:var(--ac2);border-radius:999px;padding:6px 11px;font:600 .76rem/1.2 var(--fb);cursor:pointer;text-align:left}
.chchip:hover{background:rgba(255,79,154,.18)}
.typing{display:flex;gap:5px;padding:14px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--ac2);opacity:.4;animation:tdot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{50%{opacity:1;transform:translateY(-3px)}}
.chform{display:flex;gap:8px;padding:10px 12px 6px;border-top:1px solid var(--line)}
.chin{flex:1;min-width:0;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--tx);padding:0 14px;font:500 .92rem var(--fb)}
.chin:focus{outline:none;border-color:var(--ac2);box-shadow:0 0 0 3px rgba(255,79,154,.18)}
.chmic,.chsend{width:46px;height:46px;flex:none;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font-size:1.05rem;cursor:pointer}
.chsend{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#1a0712;border:0;font-weight:900}
.chmic.on{background:#ff4d6d;border-color:#ff4d6d;animation:pulse 1.6s infinite}
.chnote{margin:0;padding:0 14px 10px;font-size:.66rem;color:var(--mu);text-align:center}
@media(max-width:560px){#nnchat{left:8px;right:8px;width:auto;bottom:8px;top:max(8px,env(safe-area-inset-top,0px));height:auto;border-radius:20px}#chfab span{display:none}#chfab{padding:0 7px}}
/* Chat als eigenes Fenster auf der Website (app/?chat) */

.langsw.top{position:absolute;top:10px;right:10px;z-index:3}.legal button,.legal a{background:none;border:0;color:var(--ac2);font-size:.78rem;text-decoration:underline;padding:2px}
.modal a.btn{text-decoration:none}

 q:{q:'How does an acute urge to nibble usually play out?',a:['It keeps getting stronger until I give in','It comes as a wave and usually fades after a short while','It stays at maximum for hours'],why:'Waves pass. The skill is buying time until it ebbs away.'},
 v:['Which wave did you ride out today?','What helped you most to hold on?']},
6:{t:'Your hand kit',lie:'Your hands need me. Where else would your fingers go?!',
 truth:'Nibbling is hand, mouth and pastime all at once. That can be replaced: stress ball, spinner ring, pen, hand cream, nail file, chewing gum. If you have a substitute within reach, you do not have to negotiate.',
 mission:'Pack your hand kit: nail file, hand cream, stress ball or spinner ring, plasters, chewing gum. Put a nail file in every place where you often nibble.',
 q:{q:'What is the smartest response to a trigger?',a:['Wait and hope','Start a prepared substitute action straight away (if-then)','Pretend nothing is happening'],why:'A plan beats willpower. The faster the substitute, the quieter the Nibbler.'},
 v:['What is in your kit?','Which item is your best ally?']},
7:{t:'Week 1: Check-in',lie:'One week, so what? You have done that before, {name}!',
 truth:'Seven days done. Around {avoid} nibbling moments avoided, and your nails had about {wachstum} worth of time to grow. Looking back helps your brain see progress, even if not everything went smoothly.',
 mission:'Write down three things that helped and one that was hard. Take a new photo of your hands and treat yourself to a small hand reward (a good cream, a manicure set).',
 q:{q:'A slip in the first week means …',a:['Everything is lost','Information, not a verdict: note the trigger and keep going straight away','I have to feel ashamed and start over'],why:'Shame keeps the cycle alive. Curiosity and a fresh start end it.'},
 v:['What was your biggest win this week?','What would you tell the person you were on day 1?']},
9:{t:'Your nails are healing',lie:'See anything? No! Nothing is growing, it is all in your head!',
 truth:'Your body has long been working for you: small cracks in the cuticles heal, your fingertips become less sensitive, and your nails grow about 0.1 mm a day on average. The Nibbler wants you to overlook the small signs.',
 mission:'Take a photo and compare it with day 1. Note three changes. In the evening, massage in hand cream or nail oil: two minutes just for your hands.',
 q:{q:'How fast do fingernails grow on average?',a:['About 3 mm per month','About 3 cm per month','They stop growing once you have bitten them'],why:'Slowly but surely, and every day visibly counts.'},
 v:['What do you see on your hands that was different nine days ago?','What do you thank your hands for?']},
10:{t:'Allies & signals',lie:'Do not tell anyone, they will only laugh at you.',
 truth:'Support improves your chances, but only the right kind: no scolding, no slapping hands away, but an agreed, friendly signal. That way you get reminded without feeling ashamed.',
 mission:'Ask someone you trust for an agreed signal (for example, briefly tapping their own hand) when they see you nibbling. Practise your answer: “Thanks for reminding me.”',
 q:{q:'What does helpful support look like?',a:['Constant comments and reminders','An agreed, friendly signal without criticism','Slapping hands away'],why:'A friendly reminder strengthens you. Criticism strengthens the Nibbler.'},
 v:['Who did you tell, and how did they react?','How does it feel not to be alone with this anymore?']},
12:{t:'“Just that one edge”, the most dangerous lie',lie:'There is only a tiny bit sticking out, one quick bite and done, {name}!',
 truth:'An edge is the most common way in: first you bite it smooth, then the next nail, then the cuticles. “Just quickly” is the line the Nibblers use to come back. You are not weak when it shows up, you are smart when you recognise it.',
 mission:'Write on a card: “Edge = nail file, not teeth.” Below it: “{warum}”. Carry it with you and check today that there is a nail file at every risky spot.',
 q:{q:'Why is “just that one edge” so risky?',a:['It often leads to the next nail and wakes up the old pattern','It is completely harmless','It makes your nails stronger'],why:'The line sounds small, the effect is big. Spot it before it works.'},
 v:['When did your mind whisper “just quickly” today?','Which line did you answer with?']},
14:{t:'Halfway: review and repeat',lie:'Two weeks, {name}! Surely you have earned a little nibble now!',
 truth:'A reward, yes, but not with the thing you are leaving behind. In 14 days you have avoided about {avoid} nibbling moments. Today we look at your weak spots: this is the review round.',
 mission:'Repeat the plan for your weakest area: {weak}. Treat yourself to a real hand reward: a manicure, a lovely polish or a nail care set.',
 q:{q:'What is the best way to reward yourself after 14 days?',a:['With a “little” nibble','With something that celebrates your hands: care, a manicure, polish','Not at all, rewards are weakness'],why:'Rewards reinforce the new behaviour. They should support the goal.'},
 v:['What has changed most in 14 days?','Which Nibbler has become the quietest?']},
16:{t:'Feelings without nibbling',lie:'Sad? Angry? Nibble, I will distract you.',
 truth:'Nibbling used to cover up many feelings. Now they show up more clearly. That can be tiring, but it is healthy. Naming a feeling often calms you down already. Waves of emotion usually fade on their own.',
 mission:'Three times today: name the feeling (“Right now I feel ___”), notice where it sits in your body, three long exhales, keep your hands warm. Note the need behind it.',
 q:{q:'What helps when a strong feeling comes up?',a:['Name it, breathe, and meet the need behind it','Push it away until it disappears','Act immediately without feeling'],why:'The feeling shows you what you need. Listening calms you down.'},
 v:['Which feeling was strong today, and what did it need?','How did you handle it without nibbling?']},
18:{t:'If it happens anyway: slip protocol',lie:'You nibbled? Then nothing matters anymore. Give up, {name}!',
 truth:'A slip is a data point, not a verdict. The most dangerous thought afterwards is “it does not matter anymore”. Stop: file the nail smooth right away, moisturise, note the trigger, keep going. You are more than that one moment.',
 mission:'Write your protocol in advance: 1) Stop & hands flat 2) File the nail smooth, moisturise 3) Note the trigger 4) One minute of competing response 5) Adjust the plan.',
 q:{q:'After a slip, your mind whispers: “Nothing matters anymore.” The strong answer?',a:['Then I might as well keep nibbling','No: a slip is information. File, note, keep going right away','I hide my hands and feel ashamed'],why:'Shame is the Nibbler’s fuel. Curiosity is your antidote.'},
 v:['Which trigger would be your biggest risk in the coming weeks?','Who reminds you kindly when things get tricky?']},
21:{t:'The Nail Pass: day 21',lie:'Day 21 … I am leaving, all right. But you will miss me, {name}!',
 truth:'21 days are a practice phase, not a guarantee, but a strong foundation. You have avoided about {avoid} nibbling moments, and your nails had around {wachstum} worth of time to grow. Sticking with it means deciding anew every day, with a plan, a nail file and support.',
 mission:'Take your after photo. Write two letters: a farewell letter to the Nibblers and a letter to yourself in three months. Then claim your Nail Pass.',
 q:{q:'Sticking with it is …',a:['Pure willpower without a plan','A decision I renew every day, with a plan and support','Automatic from now on'],why:'Exactly. Your plan, your people and your why carry you forward.'},
 v:['What do you say to the Nibblers as a farewell?','What do you write to yourself in three months?']}
},

agb:{t:'Terms of use',h:`<p class="mu"><em>Convenience translation. In case of doubt, the German version applies.</em></p>
<p><b>§ 1 Provider.</b> [Name and address of the provider].</p>
<p><b>§ 2 Subject.</b> “NagelNEU” is a free digital companion for a 21-day programme to stop nail biting. The app is a self-help and motivation tool, not a medical device, and does not replace medical or psychotherapeutic treatment. No particular result is owed.</p>
<p><b>§ 3 Free use.</b> Use is free of charge. It requires you to provide your email address with your consent. We also ask you to follow our YouTube channel ${YT_NAME}. No paid contract and no subscription is created.</p>
<p><b>§ 3a Voluntary support.</b> You can support NagelNEU voluntarily via PayPal. The payment is voluntary and without consideration; it does not unlock any features and does not create any claim to services. It is not a tax-deductible donation, and no donation receipt can be issued. Payments are processed by PayPal (Europe) S.à r.l. et Cie, S.C.A.; their terms apply. If you entered the wrong amount, contact us within 14 days at [email] and we will refund it.</p>
<p><b>§ 4 Right of use.</b> You receive a simple, non-transferable right to use the app privately and to print your diary. Copying, reselling and commercial use are prohibited. Recommending it to others is explicitly welcome.</p>
<p><b>§ 5 Data.</b> Progress, diary, photos and recordings are stored only locally in your browser. If you clear your browser data or switch devices, they are lost unless you backed them up first (“Back up data” under “Me”). You can create your PDF diary at any time.</p>
<p><b>§ 6 Liability.</b> Unlimited for intent, gross negligence and injury to life, body or health. Otherwise, liability for this free service is limited to intent and gross negligence (by analogy with §§ 521, 599 German Civil Code).</p>
<p><b>§ 7 Health notice.</b> All content is general information. Figures on nail growth are illustrative and vary between individuals. If your nail bed is inflamed (redness, swelling, pus), if nail biting causes you significant distress, or if it is linked to anxiety or compulsions, please see your GP, a dermatologist or a therapist. In an acute mental health crisis in Germany: TelefonSeelsorge 0800 111 0 111, emergency 112. Outside Germany, please contact your local emergency number.</p>
<p><b>§ 8 Copyright.</b> Design, texts, characters and software are protected by copyright. Design by Frank Zimmermann © 2026.</p>
<p><b>§ 9 Final provisions.</b> German law applies; mandatory consumer protection provisions remain unaffected. Last updated: [date].</p>`},
datenschutz:{t:'Privacy policy',h:`<p class="mu"><em>Convenience translation. In case of doubt, the German version applies.</em></p>
<p><b>Controller:</b> [Name, address, email].</p>
<p><b>Your email address:</b> We process your email address (and your first name, if provided) on the basis of your consent (Art. 6(1)(a) GDPR) to send you tips and news about NagelNEU. For this we use [name of newsletter/form service, location]. You can withdraw your consent at any time, for example via the unsubscribe link in every email or by writing to [email]. We will then delete your address.</p>
<p><b>YouTube:</b> When you tap the YouTube button, YouTube (Google Ireland Limited) opens. Only then is data transferred to YouTube; Google’s privacy policy applies.</p>
<p><b>The app:</b> Runs in your browser. Profile, progress, diary, letters, photos and voice recordings are stored only locally on your device (localStorage, IndexedDB). We do not receive this data. No tracking, no advertising cookies. For speech recognition, your browser may use its manufacturer’s service (e.g. Google in Chrome). To delete: “Reset everything” under “Me”, or clear your browser data.</p>
<p><b>Fonts and PDF:</b> Fonts and the library for creating the PDF are hosted on our own web space. Nothing is loaded from Google Fonts. Only if our own copy cannot be reached does the app load the PDF library from jsDelivr as a fallback; your IP address is then transmitted to this provider (Art. 6(1)(f) GDPR).</p>
<p><b>PayPal:</b> If you choose to support us, you are redirected to PayPal (PayPal (Europe) S.à r.l. et Cie, S.C.A., Luxembourg). PayPal processes your payment data; we receive your name, email and the amount for processing (Art. 6(1)(b) and (c) GDPR, retention under tax law). PayPal’s privacy policy applies.</p>
<p><b>Visitor counter:</b> If enabled, the page calls a counter at counterapi.dev once a day. Your IP address is transmitted to this service; no profiles are created (Art. 6(1)(f) GDPR).</p>
<p><b>Hosting:</b> [Host]; technically necessary log data (Art. 6(1)(f) GDPR).</p>
<p><b>Your rights:</b> Access, rectification, erasure, restriction, data portability, objection, withdrawal of consent and the right to lodge a complaint with a supervisory authority.</p>`},

 {id:'crisis',w:10,k:['suizid','selbstmord','umbringen','nicht mehr leben','sterben will','ritzen','selbstverletz','suicide','kill myself','end my life','self harm','self-harm','hurt myself','want to die'],a:()=>E('Das klingt nach etwas sehr Schwerem, und es ist gut, dass du es aussprichst. Bitte hol dir jetzt Unterstützung von einem Menschen: In Deutschland erreichst du die **TelefonSeelsorge** rund um die Uhr kostenlos unter **0800 111 0 111** oder **0800 111 0 222**, auch per Chat auf telefonseelsorge.de. In akuter Gefahr wähle **112**. Wenn du magst, erzähl einer vertrauten Person, wie es dir gerade geht.','That sounds really heavy, and it is good that you are saying it. Please reach out to a person right now: contact your local emergency number or a crisis line in your country (in the US call or text **988**, in the UK and Ireland call Samaritans on **116 123**, in Germany TelefonSeelsorge **0800 111 0 111**). If you are in immediate danger, call your local emergency number. If you can, tell someone you trust how you are feeling.')},
 {id:'medical',w:4,k:['entzuend','eiter','geschwollen','schwellung','blut','blutet','infekt','nagelbett','arzt','hautarzt','schmerzen','tut weh','infection','infected','pus','swollen','bleeding','blood','doctor','dermatologist','hurts','painful'],a:()=>E('Bei Rötung, Schwellung, Eiter, starken Schmerzen oder wenn es nicht besser wird, lass das bitte ärztlich anschauen (Hausarzt oder Hautarzt). Bis dahin: nicht weiter knabbern, sauber halten, nicht aufdrücken. NagelNEU ist ein Selbsthilfe-Begleiter und ersetzt keine Behandlung.','If there is redness, swelling, pus, strong pain or it is not getting better, please have it looked at by a doctor (GP or dermatologist). Until then: no more nibbling, keep it clean, do not squeeze it. NagelNEU is a self-help companion and does not replace treatment.')},
 {id:'urge',w:3,k:['drang','jetzt gerade','akut','will knabbern','will kauen','muss knabbern','kann nicht aufhoeren','notfall','sos$','urge','craving','right now','help me','about to bite','want to bite','cant stop','emergency'],a:()=>{const k=cTrig()[0];return E('Okay, jetzt zählt nur die nächste Minute:\n1. **Innehalten**: Fäuste 3 Sekunden fest ballen, lösen, Hände flach auf die Oberschenkel.\n2. **Atmen**: 4 Sekunden ein, 6 Sekunden aus, eine Minute lang.\n3. **Alternative wählen**: Knetball, Stift oder Handcreme. Spürst du eine Kante: Feile, nie die Zähne.\nDer Drang ist eine Welle, sie geht vorbei.','Okay, all that counts now is the next minute:\n1. **Pause**: clench your fists firmly for 3 seconds, release, hands flat on your thighs.\n2. **Breathe**: 4 seconds in, 6 seconds out, for one minute.\n3. **Choose an alternative**: stress ball, pen or hand cream. Feel an edge? Nail file, never your teeth.\nThe urge is a wave, it passes.')+'\n'+cAct('brake','60-Sekunden-HÄNDE-STOPP starten','Start the 60-second HANDS STOP')+(k?' ':'')},chips:['slip','tools']},
 {id:'slip',w:2,k:['ausrutscher','doch geknabbert','geknabbert','rueckfall','versagt','gescheitert','wieder angefangen','alles kaputt','slip','slipped','relapse','i bit$','bit my nails','bitten my nails','failed','messed up','gave in'],a:()=>E('Kein Drama. Ein Ausrutscher ist eine Information, kein Urteil. Gefährlich ist nur der Gedanke „jetzt ist eh alles egal“.\n**Erste Hilfe:** Nagel sofort glatt feilen und eincremen, damit keine Kante lockt. Dann notier kurz, was es ausgelöst hat, und mach einfach weiter. Die App passt deinen nächsten Tag daran an.','No drama. A slip is information, not a verdict. The only dangerous thing is the thought “nothing matters now anyway”.\n**First aid:** file the nail smooth straight away and apply cream, so no edge tempts you. Then briefly note what set it off and simply carry on. The app adjusts your next day to it.')+'\n'+cAct('slip','Ausrutscher eintragen','Log the slip'),chips:['urge','cause']},
 {id:'catch',k:['ertapp','merke nicht','merke es nicht','unbewusst','automatisch','von allein','ohne es zu merken','bemerken','notice','noticing','unconscious','without noticing','automatic','autopilot','catch myself','caught'],a:()=>E('Der erste Hebel ist nicht Willenskraft, sondern **Bemerken**. Jedes Mal, wenn deine Hand zum Mund will, tippst du auf **„Ertappt!“**. So wirst du schneller im Erkennen, und dein Tagesziel sinkt Schritt für Schritt.\n**Tipp:** Ein Pflaster auf dem Lieblingsfinger oder Bitterlack wirken wie ein Wecker, du spürst die Bewegung früher.','The first lever is not willpower but **noticing**. Every time your hand heads for your mouth, tap **“Caught it!”**. That makes you faster at spotting it, and your daily goal drops step by step.\n**Tip:** a plaster on your favourite finger or bitter nail polish work like an alarm, you feel the movement sooner.')+'\n'+cAct('catch','Jetzt ertappen','Catch it now'),chips:['triggers','tools']},
 {id:'how',k:['wie funktioniert','was ist nagelneu','programm','ablauf','methode','system','wie geht','erklaer','21 tage','how does','how it works','what is nagelneu','programme','program','method','explain','21 days','works'],a:()=>E('NagelNEU begleitet dich **21 Tage** lang, jeden Tag etwa fünf Minuten:\n1. Ein **Knibbler** (dein innerer Knabber-Antreiber) erzählt eine Lüge, du entlarvst sie mit der **Wahrheit**.\n2. **Zwei Fragen**, die mitlernen: Was du falsch beantwortest, kommt später wieder.\n3. Eine **Tagesaufgabe** und dein **Tagebuch**, schriftlich oder eingesprochen.\nDazu kommen **„Ertappt!“**, der **HÄNDE-STOPP** gegen akuten Drang und Fotos an Tag 1, 7, 14 und 21. Die App lernt aus deinen Einträgen und passt Tipps, Auslöser-Tage und Aufgaben an dich an. Die Übungen greifen Elemente auf, die auch in der Verhaltenstherapie genutzt werden.','NagelNEU guides you for **21 days**, about five minutes each day:\n1. A **Nibbler** (your inner nibbling driver) tells a lie, and you expose it with **the truth**.\n2. **Two questions** that learn with you: anything you get wrong comes back later.\n3. A **daily task** and your **diary**, written or spoken.\nOn top of that there is **“Caught it!”**, **HANDS STOP** for acute urges and photos on days 1, 7, 14 and 21. The app learns from your entries and adapts tips, trigger days and tasks to you. The exercises draw on elements that are also used in behavioural therapy.'),chips:['today','free','diary']},
 {id:'free',k:['kostet','kosten','kostenlos','gratis','preis','bezahlen','abo','free','cost','price','pay$','subscription','charge'],a:()=>E('NagelNEU ist **komplett kostenlos**, ohne Abo und ohne Vertrag. Ich bitte dich nur um deine E-Mail-Adresse und darum, meinem YouTube-Kanal @fingernägelkauen zu folgen. Wer mag, kann freiwillig über PayPal unterstützen, das ist aber keine Bedingung.','NagelNEU is **completely free**, with no subscription and no contract. I only ask for your email address and that you follow my YouTube channel @fingernägelkauen. If you like, you can support it voluntarily via PayPal, but that is not a condition.'),chips:['donate','privacy']},
 {id:'yt',k:['youtube','kanal','video','videos','abonnieren','folgen','channel','subscribe','follow'],a:()=>E('Auf meinem YouTube-Kanal **@fingernägelkauen** gibt es Videos rund ums Nägelkauen. Ein Abo hilft mir sehr, das Programm weiter zu verschenken, und hält dich bei der Stange.','On my YouTube channel **@fingernägelkauen** you will find videos all about nail biting. Subscribing helps me a lot to keep giving the programme away, and it keeps you on track.')+'\n'+cAct('yt','YouTube öffnen','Open YouTube')},
 {id:'email',k:['email','e-mail','mail$','newsletter','abmelden','spam','unsubscribe'],a:()=>E('Deine E-Mail-Adresse brauche ich, damit ich dir ab und zu Tipps und Neuigkeiten zu NagelNEU schicken kann. Kein Spam, und du kannst dich jederzeit abmelden. Details stehen in der Datenschutzerklärung.','I need your email address so I can send you tips and news about NagelNEU now and then. No spam, and you can unsubscribe at any time. Details are in the privacy policy.')+'\n'+cAct('legal','Datenschutz','Privacy','datenschutz')},
 {id:'privacy',k:['datenschutz','daten','gespeichert','speichert','sicher','privat','dsgvo','cloud','server','privacy','data','stored','store','safe','private','gdpr'],a:()=>E('Deine Einträge, Fotos und Sprachnotizen bleiben **nur auf deinem Gerät**, in deinem Browser. Nichts davon wird an einen Server geschickt oder geteilt. Nur deine E-Mail-Adresse wird bei der Anmeldung übermittelt. Tipp: Unter „Ich“ kannst du deine Daten als Datei sichern.','Your entries, photos and voice notes stay **only on your device**, in your browser. None of it is sent to a server or shared. Only your email address is transmitted when you sign up. Tip: under “Me” you can back up your data as a file.')+'\n'+cAct('legal','Datenschutzerklärung','Privacy Policy','datenschutz')},
 {id:'device',k:['anderes geraet','neues handy','handy wechseln','synchron','sync','backup','sichern','uebertragen','other device','another device','different device','new device','new phone','another phone','transfer','export','multiple devices'],a:()=>E('Weil alles nur in deinem Browser gespeichert wird, gibt es keine automatische Synchronisierung zwischen Geräten. Unter **„Ich“ → „Daten sichern“** lädst du eine Sicherungsdatei herunter. Am besten bleibst du für die 21 Tage bei einem Gerät und einem Browser.','Because everything is stored only in your browser, there is no automatic sync between devices. Under **“Me” → “Back up data”** you can download a backup file. It is best to stick to one device and one browser for the 21 days.')+'\n'+cAct('view','Zu „Ich“','Go to “Me”','ich')},
 {id:'reset',k:['zuruecksetzen','neu anfangen','von vorne','alles loeschen','profil loeschen','reset','start over','start again','delete everything','delete my data'],a:()=>E('Unter **„Ich“** ganz unten findest du **„Alles zurücksetzen“**. Damit werden Fortschritt, Notizen, Fotos und Profil auf diesem Gerät gelöscht. Sichere vorher deine Daten, falls du sie behalten möchtest. Nach einem Ausrutscher musst du übrigens nicht neu anfangen, du machst einfach weiter.','At the bottom of **“Me”** you will find **“Reset everything”**. This deletes progress, notes, photos and profile on this device. Back up your data first if you want to keep it. By the way, after a slip you do not need to start over, you just carry on.')+'\n'+cAct('view','Zu „Ich“','Go to “Me”','ich')},
 {id:'donate',k:['spende','spenden','paypal','unterstuetz','kaffee','donate','donation','support you','coffee'],a:()=>E('Danke, dass du daran denkst! Über den Knopf **„Freiwillig unterstützen“** unten auf der Seite geht es zu PayPal. Die Unterstützung ist freiwillig und ohne Gegenleistung, alle Funktionen bleiben kostenlos. Es ist keine steuerlich absetzbare Spende.','Thank you for thinking of it! The **“Support voluntarily”** button at the bottom of the page takes you to PayPal. Support is voluntary and without anything in return, all features remain free. It is not a tax-deductible donation.')+'\n'+cAct('pp','Freiwillig unterstützen','Support voluntarily')},
 {id:'triggers',k:['ausloeser','trigger','triggers','situation','wann knabbere','warum knabbere ich','meine ausloeser','my triggers','when do i','what sets'],a:()=>{const p=cP();if(!p)return E('Typische Auslöser sind Stress, Langeweile, Handy und Fernsehen, Konzentration, Nervosität, raue Kanten, Autofahren und starke Gefühle. Jeder deiner wichtigsten Auslöser bekommt im Programm einen eigenen Knibbler. ','Typical triggers are stress, boredom, phone and TV, concentration, nerves, rough edges, driving and strong feelings. Each of your main triggers gets its own Nibbler in the programme. ')+cNoProf();const tr=effTriggers();return E(`Deine wichtigsten Auslöser: **${cTL()}**.`,`Your main triggers: **${cTL()}**.`)+(tr.swapped?E(` Deine Einträge zeigen, dass dich „${T[tr.swapped].label}“ besonders oft erwischt, darum ist dieser Knibbler jetzt mit dabei.`,` Your entries show that “${T[tr.swapped].label}” catches you especially often, so this Nibbler is now part of it.`):'')+'\n\n'+cTool(cTrig()[0])},chips:['danger','ifthen']},
 {id:'danger',k:['gefahrenzeit','uhrzeit','tageszeit','wann am meisten','wann am haeufigsten','radar','danger','what time','time of day','when most'],a:()=>{if(!cP())return cNoProf();const dh=dangerHour();return dh?E(`Laut deinen Einträgen schlägt dein Knibbler meist **zwischen ${dh.from} und ${dh.to} Uhr** zu. Leg dir genau dann Feile, Creme und Knetball bereit.`,`According to your entries, your Nibbler usually strikes **between ${dh.from}:00 and ${dh.to}:00**. Have your nail file, cream and stress ball ready right then.`):E('Dafür habe ich noch zu wenig Einträge. Trag jeden Drang über den HÄNDE-STOPP oder „Ertappt!“ ein, dann zeigt dir das Gefahrenradar deine Uhrzeit.','I do not have enough entries for that yet. Log every urge with HANDS STOP or “Caught it!” and the danger radar will show you your time.')},chips:['triggers']},
 {id:'today',k:['heute','aufgabe','tagesaufgabe','was soll ich','was muss ich','welcher tag','today','task','what should i','what do i do','which day'],a:()=>{const p=cP();if(!p)return cNoProf();const d=Math.min(21,nextOpenDay());let o;try{o=buildDay(d)}catch(e){}const c=dayCatches(curDay()).length,g=goalFor(curDay());return E(`Heute ist **Tag ${Math.min(curDay(),21)}** deiner Reise.`,`Today is **day ${Math.min(curDay(),21)}** of your journey.`)+(o?E(`\nDein nächster offener Tag: **Tag ${d} · ${o.title}**\n**Aufgabe:** ${o.mission}`,`\nYour next open day: **Day ${d} · ${o.title}**\n**Task:** ${o.mission}`):'')+E(`\nHeute bisher ${c}× ertappt, Tagesziel: höchstens ${g}× knabbern.`,`\nCaught ${c}× so far today, daily goal: nibble ${g}× at most.`)+'\n'+cAct('view','Zum Tag','Go to the day','heute')},chips:['progress','diary']},
 {id:'progress',k:['fortschritt','wie weit','statistik','bilanz','wie stehe','geschafft','zahlen','progress','how am i doing','stats','statistics','how far','results'],a:()=>{const p=cP();if(!p)return cNoProf();const st=stats(),dn=doneDays().length,l=lvl();return E(`**${dn} von 21** Tagen abgeschlossen. Rund **${st.avoid||0}** Knabber-Momente vermieden, rechnerisch **${mm(st.growth||0)}** Nagel gewachsen. Insgesamt **${(S.catches||[]).length}×** ertappt. Deine Stufe: **${l.name}** (${S.xp} Punkte).`,`**${dn} of 21** days completed. Around **${st.avoid||0}** nibbling moments avoided, about **${mm(st.growth||0)}** of nail grown. Caught yourself **${(S.catches||[]).length}×** in total. Your level: **${l.name}** (${S.xp} points).`)+'\n'+(helped().split('\n').slice(0,2).join('\n'))},chips:['today','growth']},
 {id:'diary',k:['tagebuch','eintragen','notiz','schreiben','kaestchen','diary','journal','notes','write','entry'],a:()=>E('Dein **Tagebuch** öffnest du über „📖 Tagebuch“. Du kannst direkt hineinschreiben, Kästchen abhaken und deinen Tag einsprechen. Alles wird sofort gespeichert und kommt genau so ins PDF.','You open your **diary** via “📖 Diary”. You can write in it directly, tick boxes and speak your day. Everything is saved instantly and goes into the PDF exactly like that.')+'\n'+cAct('dopen','Tagebuch öffnen','Open diary'),chips:['voice','pdf']},
 {id:'voice',k:['sprach','mikro','mikrofon','einsprechen','sprechen','diktier','aufnahme','voice','microphone','mic$','speak','dictate','record'],a:()=>E('Tippe im Tagebuch auf **„Einsprechen“** und erzähl einfach, zum Beispiel: „Heute dreimal ertappt, einmal geknabbert, Drang 6, Stimmung 4. Stolz bin ich, dass ich die Feile genommen habe.“ Die App trägt Zahlen und Text automatisch ein, die Aufnahme kommt als Datei ins PDF.\n**Klappt das Mikrofon nicht?** Erlaube den Mikrofon-Zugriff im Browser. Die Seite muss über https laufen. Automatisches Mitschreiben klappt in Chrome, Edge und Safari.','In the diary, tap **“Speak”** and simply talk, for example: “Today I caught myself three times, bit once, urge 6, mood 4. I am proud that I used the nail file.” The app fills in the numbers and text automatically, and the recording goes into the PDF as a file.\n**Microphone not working?** Allow microphone access in your browser. The page must run over https. Automatic transcription works in Chrome, Edge and Safari.')+'\n'+cAct('dopen','Tagebuch öffnen','Open diary')},
 {id:'pdf',k:['pdf','drucken','ausdrucken','herunterladen','download','print','printout'],a:()=>E('Unter **„Ich“** oder im Tagebuch oben über **„📕 PDF“** erstellst du dein komplettes Tagebuch als PDF: deine Einträge, Fotos, Kurven, Sprachnotizen als Dateien und zum Schluss ein Feuerwerk mit deinem Nagel-Pass.','Under **“Me”** or via **“📕 PDF”** at the top of the diary you can create your complete diary as a PDF: your entries, photos, charts, voice notes as files and, at the end, fireworks with your Nail Pass.')+'\n'+cAct('pdf','PDF erstellen','Create PDF')},
 {id:'photo',k:['foto','fotos','bild$','bilder$','kamera','vorher nachher','photo','photos','picture','camera','before and after'],a:()=>E('Fotografiere deine Hände an **Tag 1, 7, 14 und 21**, immer mit gleichem Licht und gleicher Haltung: helles Tageslicht, beide Hände flach nebeneinander, alle zehn Nägel sichtbar. Die Fotos landen sofort in deinem Tagebuch und am Ende im PDF als Vorher/Nachher. Sie bleiben nur auf deinem Gerät.','Photograph your hands on **days 1, 7, 14 and 21**, always in the same light and the same pose: bright daylight, both hands flat side by side, all ten nails visible. The photos go straight into your diary and, at the end, into the PDF as before/after. They stay on your device only.')+'\n'+cAct('view','Zum Tresor','Go to the vault','tresor')},
 {id:'locked',k:['gesperrt','naechster tag','freigeschaltet','freischalten','warten','schloss','locked','next day','unlock','wait'],a:()=>E('Jeder Tag wird **24 Stunden nach dem vorherigen** freigeschaltet. Nägel wachsen auch nicht über Nacht, und die Pause gibt dem Gehirn Zeit, das Neue zu verankern. Wer sich vorher umschauen möchte, nutzt unter „Ich“ den Vorschau-Modus.','Each day unlocks **24 hours after the previous one**. Nails do not grow overnight either, and the break gives your brain time to anchor what is new. If you want to look around beforehand, use preview mode under “Me”.')},
 {id:'missed',k:['verpasst','vergessen','ausgelassen','pause','urlaub','krank','nicht geschafft','missed','forgot','skipped','holiday','vacation','sick','behind'],a:()=>E('Kein Problem. Du verlierst nichts: Offene Tage warten auf dich, und du machst einfach beim nächsten offenen Tag weiter. Wichtig ist nur, dass du nicht ganz aufhörst. Auch zwei Tage an einem Abend sind in Ordnung.','No problem. You do not lose anything: open days wait for you, and you simply continue with the next open day. All that matters is that you do not stop altogether. Doing two days in one evening is fine too.')+'\n'+cAct('view','Zur Reise','Go to the journey','reise')},
 {id:'growth',k:['wachsen','wachstum','wie lange','wie schnell','millimeter','mm$','nachwachsen','grow','growth','how long','how fast','grow back'],a:()=>E('Fingernägel wachsen im Schnitt **etwa 3 mm pro Monat**, also rund 0,1 mm am Tag. In 21 Tagen sind das gut 2 mm, nach etwa **6 Monaten** ist ein Fingernagel meist komplett nachgewachsen. Die Nagelhaut erholt sich schon nach wenigen Tagen sichtbar. Das ist ein Durchschnitt und individuell verschieden.','On average, fingernails grow **about 3 mm per month**, so roughly 0.1 mm a day. In 21 days that is a good 2 mm, and after about **6 months** a fingernail has usually grown back completely. Your cuticles recover visibly after just a few days. This is an average and varies from person to person.')},
 {id:'after',k:['nach 21','nach den 21','danach','tag 90','dranbleiben','langfristig','fuer immer','after 21','afterwards','long term','stay on track','forever','day 90'],a:()=>E('21 Tage sind eine Übungsphase und ein starkes Fundament, aber keine Garantie. Danach geht es weiter mit dem **Dranbleiben-Pfad bis Tag 90** unter „Plus“: wöchentliche Impulse, bis deine Nägel zu großen Teilen neu gewachsen sind. Dranbleiben heißt: jeden Tag neu entscheiden, mit Plan, Feile und Unterstützung.','21 days are a practice phase and a strong foundation, but not a guarantee. After that you continue with the **stay-on-track path to day 90** under “Plus”: weekly impulses until a large part of your nails has grown back. Sticking with it means deciding anew every day, with a plan, a nail file and support.')+'\n'+cAct('view','Zu „Plus“','Go to “Plus”','plus')},
 {id:'knibbler',k:['knibbler','figur','figuren','charakter','nibbler','character','finger figure'],a:()=>E('Die **Knibbler** sind kleine Finger-Figuren und stehen für die inneren Stimmen, die dich zum Knabbern überreden wollen. Jeder deiner Auslöser bekommt einen eigenen Knibbler mit eigener Lüge. Je öfter du sie entlarvst, desto kleinlauter werden sie, und ihre Nägel heilen mit deinen.','The **Nibblers** are little finger characters. They stand for the inner voices that try to talk you into nibbling. Each of your triggers gets its own Nibbler with its own lie. The more often you expose them, the meeker they get, and their nails heal along with yours.')},
 {id:'cuticle',k:['nagelhaut','haut','zupfen','knibbeln','huelle','cuticle','cuticles','skin','picking','pick'],a:()=>E('Die **Nagelhaut** ist oft das Lieblingsziel. Was hilft: mehrmals am Tag eincremen (weiche Haut lockt weniger), lose Hautstückchen mit einer kleinen Nagelhautschere statt mit den Zähnen entfernen und einen Knetball griffbereit haben.','The **cuticles** are often the favourite target. What helps: moisturise several times a day (soft skin is less tempting), remove loose bits of skin with small cuticle scissors instead of your teeth, and keep a stress ball within reach.')},
 {id:'tools',k:['bitterlack','bitter','pflaster','nagellack','lack$','manikuere','gel$','knetball','drehring','hilfsmittel','polish','plaster','band-aid','manicure','stress ball','fidget','tools'],a:()=>E('Bewährte Helfer:\n• **Bitterlack** oder ein **Pflaster** auf dem Lieblingsfinger als „Wecker“\n• **Feilen** an jedem Risiko-Ort: Tasche, Schreibtisch, Auto, Nachttisch\n• **Knetball, Drehring, Stift** für beschäftigte Hände\n• **Handcreme** für glatte Nagelhaut\n• Später **Nagellack oder Maniküre** als Belohnung, gepflegte Nägel knabbert man weniger gern an.','Proven helpers:\n• **Bitter nail polish** or a **plaster** on your favourite finger as an “alarm”\n• **Nail files** in every risky spot: bag, desk, car, bedside table\n• **Stress ball, spinner ring, pen** for busy hands\n• **Hand cream** for smooth cuticles\n• Later, **nail polish or a manicure** as a reward: people are less likely to nibble well-kept nails.')},
 {id:'cause',w:1.5,k:['warum knabbere','warum kaue','ursache','woher kommt','grund$','psychisch','why do i','why do people','cause','reason','where does it come'],a:()=>E('Nägelkauen ist eine sehr häufige, körperbezogene Gewohnheit. Sie läuft oft in Sekunden und ganz automatisch ab und wird durch Stress, Langeweile, Konzentration oder raue Kanten ausgelöst. Kurz fühlt es sich beruhigend an, darum verstärkt sie sich selbst. Das ist keine Charakterschwäche. Der Weg raus: bemerken, unterbrechen, ersetzen, belohnen.','Nail biting is a very common, body-focused habit. It often happens within seconds and completely automatically, triggered by stress, boredom, concentration or rough edges. For a moment it feels soothing, which is why it reinforces itself. It is not a character flaw. The way out: notice, interrupt, replace, reward.'),chips:['triggers','how']},
 {id:'disorder',k:['krankheit','stoerung','zwang','zwangsstoerung','therapie','therapeut','onychophagie','disorder','ocd$','compulsion','therapy','therapist','onychophagia','bfrb'],a:()=>E('Häufiges Nägelkauen (Onychophagie) zählt zu den körperbezogenen, sich wiederholenden Verhaltensweisen. Für viele ist es eine hartnäckige Gewohnheit, die man mit Training gut in den Griff bekommt. Wenn du stark darunter leidest, es mit Angst, Zwängen oder Niedergeschlagenheit einhergeht oder sich trotz Übung nichts ändert, kann eine Verhaltenstherapie sehr helfen. Sprich dafür mit deiner Hausärztin oder deinem Hausarzt.','Frequent nail biting (onychophagia) is one of the body-focused repetitive behaviours. For many people it is a stubborn habit that can be managed well with practice. If you are really suffering from it, if it comes with anxiety, compulsions or low mood, or if nothing changes despite practice, behavioural therapy can help a lot. Talk to your GP about it.')},
 {id:'stress',k:['stress','gestresst','druck','pruefung','arbeit','buero','stressed','pressure','exam','work$','office','deadline'],a:()=>cTool('stress')},
 {id:'bored',k:['langeweile','langweilig','warten','bored','boredom','waiting'],a:()=>cTool('langeweile')},
 {id:'screen',k:['handy','fernseh','fernsehen','serie','netflix','zocken','gaming','tv$','phone','series','screen$','watching'],a:()=>cTool('screen')},
 {id:'focus',k:['konzentr','lernen','lesen','nachdenken','focus','studying','concentrat','reading','thinking'],a:()=>cTool('fokus')},
 {id:'nervous',k:['nervoes','aufgeregt','angst','termin','nervous','anxious','anxiety','appointment','interview'],a:()=>cTool('nervos')},
 {id:'edge',k:['kante','rau$','eingerissen','abgebrochen','edge','rough','torn','broken nail','hangnail'],a:()=>cTool('kante')},
 {id:'car',k:['auto$','autofahren','ampel','fahren','stau$','car$','driving','traffic','commute'],a:()=>cTool('auto')},
 {id:'feel',k:['traurig','wut','wuetend','frust','einsam','gefuehl','sad$','angry','anger','frustrated','lonely','feelings'],a:()=>cTool('gefuehle')},
 {id:'brake',k:['haende-stopp','haende stopp','haendestopp','gegenreaktion','fauest','faeuste','hands stop','competing response','fists'],a:()=>E('Der **HÄNDE-STOPP** ist eine Minute geführte Gegenreaktion: Fäuste fest ballen, lösen, Hände flach auf die Oberschenkel, dazu 4 Sekunden ein- und 6 Sekunden ausatmen. Fäuste und flache Hände können nicht gleichzeitig knabbern, das ist der ganze Trick. Vorher und nachher gibst du an, wie stark der Drang ist, so lernt die App, was bei dir wirkt.','**HANDS STOP** is one minute of guided competing response: clench your fists firmly, release, hands flat on your thighs, breathing in for 4 seconds and out for 6. Fists and flat hands cannot nibble at the same time, that is the whole trick. Before and after, you rate how strong the urge is, so the app learns what works for you.')+'\n'+cAct('brake','HÄNDE-STOPP starten','Start HANDS STOP')},
 {id:'4b',k:['4 b$','vier b$','4b$','methode','haende-stopp-methode','schritte','method','4 steps','four steps','steps'],a:()=>E('Die **HÄNDE-STOPP-Methode** in vier Schritten:\n1. **Wahrnehmen**: „Meine Hand will zum Mund.“ Schon das ist ein Erfolg.\n2. **Innehalten**: Fäuste 3 Sekunden fest, lösen, Hände flach. 4 Sekunden ein, 6 Sekunden aus.\n3. **Alternative wählen**: Knetball, Stift, Ring oder Handcreme.\n4. **Reflektieren**: Was hat es ausgelöst, was hat geholfen?','The **HANDS STOP method** in four steps:\n1. **Notice**: “My hand wants to go to my mouth.” That alone is a success.\n2. **Pause**: fists tight for 3 seconds, release, hands flat. Breathe in for 4, out for 6.\n3. **Choose an alternative**: stress ball, pen, ring or hand cream.\n4. **Reflect**: what set it off, and what helped?')},
 {id:'ifthen',k:['wenn-dann','wenn dann','plan$','satz$','if-then','if then','my plan'],a:()=>{if(!cP())return E('Ein **Wenn-dann-Satz** legt vorher fest, was du in deiner Gefahrensituation tust, zum Beispiel: „Wenn ich eine Kante spüre, greife ich zur Feile, nie zu den Zähnen.“ Ein Plan schlägt Willenskraft. ','An **if-then plan** decides in advance what you will do in your risky situation, for example: “When I feel an edge, I reach for the nail file, never my teeth.” A plan beats willpower. ')+cNoProf();return E('Deine **Wenn-dann-Sätze**:','Your **if-then plans**:')+'\n'+cTrig().map(k=>`• **${T[k].label}**: ${IF(k)}`).join('\n')}},
 {id:'points',k:['punkte','abzeichen','stufe','level','xp$','badge','badges','points','rank'],a:()=>{const l=lvl();return E(`Du sammelst Punkte für geschaffte Tage, richtige Antworten, Notizen und jedes Ertappen. Deine Stufe: **${l.name}** mit **${S.xp} Punkten**${l.next?`, die nächste Stufe gibt es ab ${l.next}`:''}. Abzeichen siehst du unter „Üben“.`,`You collect points for completed days, correct answers, notes and every catch. Your level: **${l.name}** with **${S.xp} points**${l.next?`, the next level starts at ${l.next}`:''}. You can see your badges under “Practice”.`)}},
 {id:'reward',k:['belohnung','belohnen','goennen','reward','treat'],a:()=>E('Im **Belohnungskonto** unter „Plus“ legst du dir Hand-Belohnungen fest, zum Beispiel eine Maniküre nach 14 Tagen, und schaltest sie mit geschafften Tagen frei. Wichtig: belohne dich nie mit dem, was du hinter dir lässt.','In the **reward account** under “Plus” you set hand rewards for yourself, for example a manicure after 14 days, and unlock them with completed days. Important: never reward yourself with the thing you are leaving behind.')+'\n'+cAct('view','Zu „Plus“','Go to “Plus”','plus')},
 {id:'remind',k:['erinnerung','erinnern','kalender','wecker','benachrichtigung','reminder','remind','calendar','notification','alarm'],a:()=>E('Unter **„Plus“ → „Kalender-Erinnerung“** lädst du eine Kalenderdatei mit 21 täglichen Terminen samt Erinnerung herunter. Die passt in jeden Kalender (Google, Apple, Outlook).','Under **“Plus” → “Calendar reminder”** you can download a calendar file with 21 daily appointments including a reminder. It works with any calendar (Google, Apple, Outlook).')+'\n'+cAct('view','Zu „Plus“','Go to “Plus”','plus')},
 {id:'social',k:['familie','freunde','partner','kollegen','unterstuetzer','erzaehlen','peinlich','schaemen','scham','family','friends','colleagues','partner','tell people','embarrass','ashamed','shame'],a:()=>E('Unterstützung macht es viel leichter. Unter „Plus“ findest du fertige **Unterstützer-Nachrichten** für Familie, Freunde und Kollegen. Vereinbart am besten ein **freundliches Zeichen**, zum Beispiel kurz an die eigene Hand tippen, statt Kommentare. Und zur Scham: Viele verstecken ihre Hände, du bist nicht allein. Scham hilft dem Knibbler mehr als dir.','Support makes it much easier. Under “Plus” you will find ready-made **messages for supporters** for family, friends and colleagues. Agree on a **friendly signal**, for example briefly tapping your own hand, instead of comments. And about shame: many people hide their hands, you are not alone. Shame helps the Nibbler more than it helps you.')+'\n'+cAct('view','Zu „Plus“','Go to “Plus”','plus')},
 {id:'kids',k:['kind$','kinder$','tochter','sohn$','jugendlich','schule','child','children','kid$','kids$','daughter','son$','teen$','teens$','school'],a:()=>E('NagelNEU ist für Erwachsene geschrieben. Bei Kindern hilft vor allem: kein Schimpfen und kein Ermahnen vor anderen, ein vereinbartes freundliches Zeichen, beschäftigte Hände (Knetball, Fidget), kurze Nägel und Lob für jedes Bemerken. Wenn es zu Entzündungen kommt oder das Kind sehr belastet ist, sprecht mit der Kinderärztin oder dem Kinderarzt.','NagelNEU is written for adults. With children, what helps most: no scolding and no telling off in front of others, an agreed friendly signal, busy hands (stress ball, fidget toy), short nails and praise for every time they notice. If it leads to inflammation or the child is very distressed, talk to your paediatrician.')},
 {id:'motivation',k:['motivation','keine lust','schaffe es nicht','aufgeben','sinnlos','klappt nicht','hoffnungslos','zweifel','give up','no motivation','cant do it','pointless','not working','hopeless','doubt'],a:()=>{const p=cP(),w=p&&(p.warum||[])[0];return E(`Zweifel gehören dazu, gerade um die Mitte herum. Du musst nicht perfekt sein, nur weitermachen. Jedes Ertappen zählt, auch an schlechten Tagen.${w?` Denk an dein Warum: **„${w}“**.`:''} Heute reicht die kleinste Version: einmal ertappen, einmal HÄNDE-STOPP.`,`Doubts are part of it, especially around the middle. You do not have to be perfect, just keep going. Every catch counts, even on bad days.${w?` Remember your why: **“${wv(w)}”**.`:''} Today the smallest version is enough: catch yourself once, do HANDS STOP once.`)},chips:['urge','progress']},
 {id:'start',k:['startdatum','starttermin','verschieben','spaeter starten','start date','postpone','start later','when do i start'],a:()=>E('Den Starttermin wählst du bei der Einrichtung: sofort, morgen früh oder an einem bestimmten Tag. Bis dahin zeigt dir die App einen Countdown und was du vorbereiten kannst. Möchtest du komplett neu planen, setzt du unter „Ich“ alles zurück.','You choose your start date during setup: right away, tomorrow morning or on a specific day. Until then the app shows you a countdown and what you can prepare. If you want to plan from scratch, reset everything under “Me”.')},
 {id:'lang',k:['englisch','deutsch','sprache','english','german','language','deutsch umstellen'],a:()=>E('Die Sprache stellst du ganz unten auf der Seite um: **DE | EN**. Auch im Tagebuch oben gibt es den Umschalter.','You can change the language at the very bottom of the page: **DE | EN**. There is also a switch at the top of the diary.')},
